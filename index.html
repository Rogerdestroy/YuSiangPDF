<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>本機 PDF 工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500&family=LXGW+WenKai+TC&family=Great+Vibes&display=swap">
<style>
/* Layout: a workbench — tool shelf on the home view; each tool opens as a two-pane bench (work surface left, settings rail right). */
:root{
  --bg:#eceff3; --surface:#fbfcfd; --sunk:#e2e6ec; --ink:#17202a; --muted:#5b6674; --line:#cdd4dd; --line-soft:#dde2e9;
  --accent:#c63f2b; --accent-ink:#ffffff; --accent-soft:#f6e1dd; --focus:#2b5cc0;
  --g-org:#c63f2b; --g-opt:#2e7a49; --g-conv:#2a59ba; --g-edit:#984282; --g-sec:#33536f; --g-ai:#5945c2; --g-flow:#a96409;
  --ok:#2e7a49; --warn:#9a5d00; --err:#b3261e; --err-soft:#fbe4e1;
  --add:#d7f0dd; --add-ink:#14532d; --del:#fbe0dc; --del-ink:#7f1d1d;
  --shadow:0 1px 2px rgba(23,32,42,.06),0 6px 18px rgba(23,32,42,.06);
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11151b; --surface:#181d25; --sunk:#0c1015; --ink:#e5e9ef; --muted:#9aa4b2; --line:#2c3542; --line-soft:#232b36;
  --accent:#ef6650; --accent-ink:#1a0a07; --accent-soft:#3a201b; --focus:#7aa2ff;
  --g-org:#e0634d; --g-opt:#4caa6b; --g-conv:#5d8ae6; --g-edit:#c46aae; --g-sec:#6f93b8; --g-ai:#8b79f0; --g-flow:#dd9737;
  --ok:#5cc47f; --warn:#e2a64b; --err:#ff8a80; --err-soft:#3b1c1a;
  --add:#173a24; --add-ink:#b7f0c8; --del:#4a1f1b; --del-ink:#ffc9c0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11151b; --surface:#181d25; --sunk:#0c1015; --ink:#e5e9ef; --muted:#9aa4b2; --line:#2c3542; --line-soft:#232b36;
  --accent:#ef6650; --accent-ink:#1a0a07; --accent-soft:#3a201b; --focus:#7aa2ff;
  --g-org:#e0634d; --g-opt:#4caa6b; --g-conv:#5d8ae6; --g-edit:#c46aae; --g-sec:#6f93b8; --g-ai:#8b79f0; --g-flow:#dd9737;
  --ok:#5cc47f; --warn:#e2a64b; --err:#ff8a80; --err-soft:#3b1c1a;
  --add:#173a24; --add-ink:#b7f0c8; --del:#4a1f1b; --del-ink:#ffc9c0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.25}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
a{color:var(--focus)}

/* header */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:22px 18px;border-bottom:1px solid var(--line);margin-bottom:24px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.brand-mark{width:34px;height:42px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:900;font-size:15px;
  clip-path:polygon(0 0,70% 0,100% 22%,100% 100%,0 100%);letter-spacing:.02em}
.brand h1{font-size:21px;font-weight:900;letter-spacing:.02em}
.brand small{display:block;color:var(--muted);font-size:12.5px;font-weight:500;letter-spacing:.04em}
.local{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:6px 12px;border-radius:999px}
.local i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}

/* home */
.quick{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:stretch;margin-bottom:34px}
.quick-copy{padding-block:6px}
.quick-copy .eyebrow{font-size:12px;letter-spacing:.14em;color:var(--accent);font-weight:700}
.quick-copy h2{font-size:clamp(26px,3.6vw,38px);font-weight:900;margin:8px 0 10px;letter-spacing:.01em}
.quick-copy p{color:var(--muted);max-width:34em;margin:0}
.strip{display:flex;gap:6px;margin-top:18px;align-items:flex-end}
.strip span{width:30px;height:38px;background:var(--surface);border:1px solid var(--line);font:500 11px var(--font-mono);display:grid;place-items:end center;padding-bottom:3px;color:var(--muted);
  clip-path:polygon(0 0,72% 0,100% 20%,100% 100%,0 100%)}
.strip span:nth-child(2){transform:translateY(-6px)}.strip span:nth-child(3){transform:translateY(-12px)}.strip span:nth-child(4){transform:translateY(-6px)}
.group{margin-bottom:28px}
.group-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.group-h h2{font-size:14px;font-weight:700;letter-spacing:.08em}
.group-h span{font-size:12px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{display:flex;gap:14px;align-items:flex-start;padding:16px;background:var(--surface);border:1px solid var(--line-soft);border-radius:10px;text-decoration:none;color:inherit;transition:border-color .15s,transform .15s,box-shadow .15s}
.card:hover{border-color:var(--line);box-shadow:var(--shadow);transform:translateY(-1px)}
.card h3{font-size:15.5px;font-weight:700;margin-bottom:3px}
.card p{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
.card > div{min-width:0}
.glyph{flex:none;width:38px;height:46px;background:var(--gc,var(--accent));color:#fff;display:grid;place-items:center;font-weight:900;font-size:15px;
  clip-path:polygon(0 0,68% 0,100% 22%,100% 100%,0 100%);font-family:var(--font-body)}
.glyph.lg{width:46px;height:56px;font-size:18px}
:root[data-theme="dark"] .glyph{color:#0f1216}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .glyph{color:#0f1216} }

/* tool view */
.tool-head{display:flex;gap:16px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.back{font-size:13.5px;color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.back:hover{color:var(--ink)}
.tool-title{display:flex;gap:14px;align-items:center;min-width:0}
.tool-title h2{font-size:24px;font-weight:900}
.tool-title p{margin:2px 0 0;color:var(--muted);font-size:14px}
.bench{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.work{min-width:0;display:flex;flex-direction:column;gap:14px}
.side{position:sticky;top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:16px}
.opts{display:flex;flex-direction:column;gap:14px}
.opts:empty{display:none}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.flabel{font-size:12.5px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);margin:0;line-height:1.5}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{resize:vertical;min-height:70px}
input[type=color]{width:44px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row > *{min-width:0}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{margin-top:5px;accent-color:var(--accent)}
.seg{position:relative;display:flex;flex-wrap:wrap;gap:4px;background:var(--sunk);padding:4px;border-radius:9px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{flex:1 1 auto;text-align:center;padding:6px 10px;border-radius:6px;font-size:13.5px;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg input:checked + label{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg input:focus-visible + label{outline:2px solid var(--focus)}
.slider{display:flex;align-items:center;gap:10px}
.slider input{flex:1;accent-color:var(--accent)}
.slider output{font:500 12.5px var(--font-mono);min-width:52px;text-align:right;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;font-size:14px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.wide{width:100%;padding:11px 14px;font-size:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ib{width:28px;height:28px;padding:0;display:inline-grid;place-items:center;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:15px;line-height:1}
.ib:hover{border-color:var(--muted)}

/* drop zone */
.drop{border:1.5px dashed var(--line);border-radius:12px;background:var(--surface);padding:34px 20px;text-align:center;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop-in{display:flex;flex-direction:column;align-items:center;gap:10px}
.drop-in strong{font-size:17px}
.drop-in > span{color:var(--muted);font-size:13px}
.drop.compact{padding:12px 16px}
.drop.compact .drop-in{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:10px}
.drop.compact .drop-in strong{font-size:14px;font-weight:500;color:var(--muted)}
.drop.compact .drop-in > span{display:none}
.quick .drop{display:grid;place-items:center;min-height:190px;border-width:2px}

/* file list */
.files{display:flex;flex-direction:column;gap:6px}
.file{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line-soft);border-radius:9px;padding:9px 12px}
.file .fi{flex:none;width:22px;height:27px;background:var(--accent);clip-path:polygon(0 0,68% 0,100% 24%,100% 100%,0 100%)}
.file .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.file .fm{font:500 12px var(--font-mono);color:var(--muted);white-space:nowrap}
.file[draggable=true]{cursor:grab}
.file.dragging{opacity:.4}
.file .num{font:500 12px var(--font-mono);color:var(--muted);width:20px;text-align:right}

/* thumbnails */
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:12px}
.thumb{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;border-radius:9px;border:1.5px solid transparent;background:var(--surface)}
.thumbs.selectable .thumb{cursor:pointer}
.thumb.sel{border-color:var(--accent);background:var(--accent-soft)}
.thumb.sel::after{content:"✓";position:absolute;top:6px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:12px;display:grid;place-items:center;font-weight:700}
.tframe{width:100%;aspect-ratio:1/1;display:grid;place-items:center;overflow:hidden}
.tframe canvas{max-width:86%;max-height:86%;box-shadow:0 1px 4px rgba(0,0,0,.25);background:#fff;transition:transform .2s}
.tnum{font:500 12px var(--font-mono);color:var(--muted)}
.tbtns{display:flex;gap:6px}
.fsection{display:flex;flex-direction:column;gap:10px}
.fsection h3{font-size:14px;font-weight:700;overflow-wrap:anywhere}

/* viewer */
.viewer{display:flex;flex-direction:column;gap:10px;min-width:0}
.pager{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.pglabel{font-size:13px;color:var(--muted)}
.stagewrap{display:flex;justify-content:center;background:var(--sunk);border-radius:12px;padding:16px;overflow:auto}
.stage{position:relative;line-height:0;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.stage canvas{display:block}
.ocanvas{position:absolute;inset:0;touch-action:none}
.tools{display:flex;flex-wrap:wrap;gap:6px}
.tools .btn{flex:1 1 auto}

/* status, results */
.status:empty{display:none}
.prog{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.bar.indet i{width:35%;animation:ind 1.1s ease-in-out infinite}
@keyframes ind{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
@media (prefers-reduced-motion: reduce){.bar.indet i{animation:none;width:100%;opacity:.5}.card{transition:none}}
.results:empty{display:none}
.results{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:16px}
.results h3{font-size:15px;display:flex;align-items:center;gap:8px}
.results h3::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--ok)}
.outs{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}
.out{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line-soft);border-radius:8px;background:var(--bg)}
.out > div{flex:1;min-width:0}
.out b{display:block;font-weight:500;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.out small{font:500 11.5px var(--font-mono);color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:0;background:var(--bg);border-radius:8px;padding:8px 10px}
.err{background:var(--err-soft);color:var(--err);border-radius:8px;padding:10px 12px;font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:16px;min-width:0}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px}

/* diff */
.dpage{margin-bottom:16px}
.dpage h4{margin:0 0 8px;font-size:14px;display:flex;gap:10px;align-items:center}
.pill{font:500 11.5px var(--font-mono);padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.pill.chg{background:var(--del);color:var(--del-ink)}
.dtable{width:100%;border-collapse:collapse;font-size:13.5px;table-layout:fixed}
.dtable td{vertical-align:top;padding:3px 8px;border-bottom:1px solid var(--line-soft);overflow-wrap:anywhere;width:50%}
td.dl{background:var(--del);color:var(--del-ink)} td.da{background:var(--add);color:var(--add-ink)}
.dtable mark.dl{background:color-mix(in srgb,var(--del-ink) 22%,transparent);color:inherit;border-radius:2px}
.dtable mark.da{background:color-mix(in srgb,var(--add-ink) 22%,transparent);color:inherit;border-radius:2px}
.dhead td{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;border-bottom:1px solid var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.vcanvas{max-width:100%;height:auto;box-shadow:0 2px 10px rgba(0,0,0,.18);background:#fff}
.tablewrap{overflow-x:auto}
.ptable{border-collapse:collapse;font-size:12.5px}
.ptable td{border:1px solid var(--line);padding:3px 7px;white-space:nowrap}
.md{font-size:14.5px;line-height:1.75;max-width:72ch}
.md h2{font-size:18px;margin:16px 0 6px}.md h3{font-size:16px;margin:14px 0 6px}
.md ul{padding-left:1.3em;margin:6px 0}.md p{margin:8px 0}
.codeout{width:100%;min-height:420px;font:13px/1.6 var(--font-mono);background:var(--bg)}
.sigpad{width:100%;height:170px;background:#fff;border:1px solid var(--line);border-radius:8px;touch-action:none;display:block;cursor:crosshair}
.sigprev{background:#fff;border:1px solid var(--line);border-radius:8px;min-height:60px;display:grid;place-items:center;padding:8px}
.sigprev canvas{max-width:100%;max-height:110px}
.pos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;max-width:150px}
.pos button{aspect-ratio:1.4;border:1px solid var(--line);background:var(--bg);border-radius:5px;cursor:pointer;position:relative}
.pos button::after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:var(--muted);inset:0;margin:auto}
.pos button.on{background:var(--accent-soft);border-color:var(--accent)}
.pos button.on::after{background:var(--accent)}
.step{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--bg)}
.step-h{display:flex;align-items:center;gap:8px}
.step-h b{flex:1;font-size:14px}
.step-h .mono{color:var(--muted);font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:14px;z-index:50;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.flist{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow:auto;padding-right:4px}
.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}

@media (max-width:920px){
  .bench{grid-template-columns:minmax(0,1fr)}
  .side{position:static}
  .quick{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:480px){
  .local{margin-left:0}
  .cards{grid-template-columns:minmax(0,1fr)}
  .stagewrap{padding:8px}
}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <a class="brand" href="#">
      <span class="brand-mark">PDF</span>
      <span><h1>本機 PDF 工作台</h1><small>拆分 · 合併 · 轉檔 · 編輯 · 加密</small></span>
    </a>
    <span class="local"><i></i>檔案只在你的瀏覽器裡處理，不會上傳</span>
  </header>
  <main id="app"></main>
  <footer class="foot" id="foot">處理全部在這個頁面內完成，檔案不會傳出。</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@cantoo/pdf-lib@2.3.2/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>
"use strict";
/* ---------- basics ---------- */
const LIBS={
  zip:'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js',
  ppt:'https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js',
  xlsx:'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
  docx:'https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js',
  data:'pdfdata.js'
};
const IN_CLAUDE=!!(window.claude&&window.claude.use);
const FONT='"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';

const scriptCache={};
function loadScript(src){
  return scriptCache[src] ||= new Promise((res,rej)=>{
    const s=document.createElement('script'); s.src=src; s.onload=()=>res(); s.onerror=()=>{delete scriptCache[src];rej(new UserError('無法載入需要的元件，請確認網路連線後再試一次。'))};
    document.head.appendChild(s);

/* ---------- core operations (bytes in, bytes out) ---------- */
async function coreRotate(f,deg,pages){ const lib=await openLib(f); lib.getPages().forEach((p,i)=>{ const d=Array.isArray(deg)?(deg[i]||0):((!pages||pages.includes(i))?deg:0); if(d) p.setRotation(PDFLib.degrees(((p.getRotation().angle+d)%360+360)%360)) }); return lib.save() }
async function coreExtract(f,idx){ const src=await openLib(f); const d=await PDFLib.PDFDocument.create(); (await d.copyPages(src,idx)).forEach(p=>d.addPage(p)); return d.save() }
async function coreRaster(f,{dpi=110,q=.7,gray=false,onProgress,pages,paint}={}){
  const js=await f.js(); const out=await PDFLib.PDFDocument.create();
  for(let i=0;i<js.numPages;i++){ onProgress?.(i/js.numPages); const pg=await js.getPage(i+1); const vp1=pg.getViewport({scale:1}); const c=await renderToCanvas(pg,dpi/72); if(gray) grayscale(c); const img=await out.embedJpg(await canvasBytes(c,'image/jpeg',q)); c.width=0; const p=out.addPage([vp1.width,vp1.height]); p.drawImage(img,{x:0,y:0,width:vp1.width,height:vp1.height}); }
  return out.save();
}
const COMPRESS={light:{dpi:150,q:.8,label:'輕度'},medium:{dpi:110,q:.68,label:'建議'},strong:{dpi:75,q:.5,label:'強力'}};
async function coreCompress(f,level,{gray=false,onProgress}={}){
  if(level==='lossless'){ const lib=await openLib(f); return lib.save({useObjectStreams:true}) }
  return coreRaster(f,{...COMPRESS[level],gray,onProgress});
}
function drawWatermark(ctx,W,H,o){
  ctx.save(); ctx.globalAlpha=o.opacity; let w,hh,paint; const ang=-o.angle*Math.PI/180;
  if(o.kind==='image'){ if(!o.img){ctx.restore();return} w=W*o.scale; hh=w*o.img.height/o.img.width; paint=()=>ctx.drawImage(o.img,-w/2,-hh/2,w,hh) }
  else { const lines=(o.text||'').split('\n'); ctx.font=`700 ${o.size}px ${FONT}`; ctx.fillStyle=o.color; ctx.textAlign='center'; ctx.textBaseline='middle'; w=Math.max(1,...lines.map(l=>ctx.measureText(l).width)); hh=lines.length*o.size*1.2; paint=()=>lines.forEach((l,i)=>ctx.fillText(l,0,(i-(lines.length-1)/2)*o.size*1.2)) }
  const at=(x,y)=>{ ctx.save(); ctx.translate(x,y); ctx.rotate(ang); paint(); ctx.restore() };
  if(o.pos==='tile'){ const sx=w+Math.max(60,w*.5),sy=hh+Math.max(80,hh*1.6); let r=0; for(let y=-H*.2;y<H*1.2;y+=sy,r++) for(let x=-W*.2+(r%2)*sx/2;x<W*1.2;x+=sx) at(x,y) }
  else { const ca=Math.abs(Math.cos(ang)),sa=Math.abs(Math.sin(ang)); const ex=(ca*w+sa*hh)/2,ey=(sa*w+ca*hh)/2; const m=30; const col=o.pos%3,row=Math.floor(o.pos/3);
    at([m+ex,W/2,W-m-ex][col],[m+ey,H/2,H-m-ey][row]) }
  ctx.restore();
}
async function coreWatermark(f,o,pagesSpec){
  const lib=await openLib(f); const js=await f.js(); const pages=lib.getPages(); const idx=pagesSpec?.trim()?parseRanges(pagesSpec,pages.length).flat():[...pages.keys()];
  if(document.fonts) await document.fonts.load(`700 40px "Noto Sans TC"`,o.text||'字').catch(()=>{});
  const cache={};
  for(const i of [...new Set(idx)]){ const pg=await js.getPage(i+1); const vp1=pg.getViewport({scale:1}); const key=`${Math.round(vp1.width)}x${Math.round(vp1.height)}`;
    if(!cache[key]){ const K=Math.min(2.5,2800/Math.max(vp1.width,vp1.height)); const c=document.createElement('canvas'); c.width=Math.round(vp1.width*K); c.height=Math.round(vp1.height*K); const ctx=c.getContext('2d'); ctx.scale(K,K); drawWatermark(ctx,vp1.width,vp1.height,o); cache[key]=await lib.embedPng(await canvasBytes(c,'image/png')) }
    stamp(pages[i],cache[key],vp1) }
  return lib.save();
}
async function coreProtect(f,{user,owner,perms}){ const lib=await openLib(f); lib.encrypt({userPassword:user||'',ownerPassword:owner||user,permissions:perms}); return lib.save() }
function hasEncrypt(u8){ const tail=u8.subarray(Math.max(0,u8.length-60000)); let s=''; for(let i=0;i<tail.length;i+=8192) s+=String.fromCharCode(...tail.subarray(i,i+8192)); if(s.includes('/Encrypt')) return true; const head=u8.subarray(0,Math.min(u8.length,4096)); return String.fromCharCode(...head).includes('/Encrypt') }
async function coreUnlock(f,pw,onProgress){
  try{ const lib=await PDFLib.PDFDocument.load(f.bytes,{password:pw||'',updateMetadata:false}); return {bytes:await lib.save(),raster:false} }
  catch(e){
    if(/incorrect/i.test(e.message)) throw new UserError(`「${f.name}」的密碼不正確。`);
    if(/NEEDS PASSWORD/i.test(e.message)&&!pw) throw new UserError(`「${f.name}」需要開啟密碼，請在右側輸入。`);
    let js; try{ js=await pdfjsLib.getDocument({data:f.bytes.slice(),password:pw||undefined,isEvalSupported:false,CMapReaderFactory:CMapFactory,StandardFontDataFactory:FontDataFactory}).promise }
    catch(e2){ if(e2?.name==='PasswordException') throw new UserError(pw?`「${f.name}」的密碼不正確。`:`「${f.name}」需要開啟密碼，請在右側輸入。`); throw e2 }
    const tmp=new PdfFile(f.name,f.bytes); tmp._js=Promise.resolve(js); return {bytes:await coreRaster(tmp,{dpi:170,q:.85,onProgress}),raster:true};
  }
}

/* ----- compare ----- */
function lcsDiff(a,b,eq=(x,y)=>x===y){
  const n=a.length,m=b.length; if(n*m>4e6){ return [...a.map(x=>({t:'-',a:x})),...b.map(y=>({t:'+',b:y}))] }
  const dp=Array.from({length:n+1},()=>new Uint32Array(m+1));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) dp[i][j]=eq(a[i],b[j])?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const ops=[]; let i=0,j=0; while(i<n&&j<m){ if(eq(a[i],b[j])){ops.push({t:'=',a:a[i],b:b[j]});i++;j++} else if(dp[i+1][j]>=dp[i][j+1]) ops.push({t:'-',a:a[i++]}); else ops.push({t:'+',b:b[j++]}) }
  while(i<n) ops.push({t:'-',a:a[i++]}); while(j<m) ops.push({t:'+',b:b[j++]}); return ops;
}
function charMarks(a,b){
  const A=[...a],B=[...b]; if(A.length*B.length>250000) return [h('mark',{class:'dl'},a),h('mark',{class:'da'},b)];
  const ops=lcsDiff(A,B); const L=[],R=[]; ops.forEach(o=>{ if(o.t==='=') {L.push(o.a);R.push(o.b)} else if(o.t==='-') L.push(h('mark',{class:'dl'},o.a)); else R.push(h('mark',{class:'da'},o.b)) });
  return [L,R];
}

function mdFromPages(pages,{tables=true,sep=true}={}){
  const body=bodySize(pages.flatMap(p=>p.lines)); const out=[];
  for(const p of pages){
    if(sep&&pages.length>1) out.push(`<!-- 第 ${p.n} 頁 -->`);
    const L=p.lines; let k=0;
    while(k<L.length){
      if(tables&&L[k].cells.length>=3){ let e=k; while(e<L.length&&L[e].cells.length>=2) e++; if(e-k>=2){ const rows=tableFromLines(L.slice(k,e)); const cols=rows[0].length; const cell=s=>String(s).replace(/\|/g,'\\|'); out.push('| '+rows[0].map(cell).join(' | ')+' |','| '+Array(cols).fill('---').join(' | ')+' |',...rows.slice(1).map(r=>'| '+r.map(cell).join(' | ')+' |'),''); k=e; continue } }
      let e=k; while(e<L.length&&!(tables&&L[e].cells.length>=3&&L[e+1]?.cells.length>=2)) e++; if(e===k) e=k+1;
      for(const para of paragraphs(L.slice(k,e),body)){
        if(para.head) out.push('#'.repeat(para.level+1)+' '+para.text,'');
        else if(para.bullet){ const t=para.text.replace(BULLET,''); out.push((/^\(?\d/.test(para.text)?para.text.match(/\d+/)[0]+'. ':'- ')+t) }
        else out.push(para.text,'');
      }
      k=e;
    }
    if(p.links?.length) out.push('',...p.links.map(u=>`- <${u}>`),'');
    if(sep&&pages.length>1) out.push('','---','');
  }
  return out.join('\n').replace(/\n{3,}/g,'\n\n').trim()+'\n';
}

function trimCanvas(c){
  const ctx=c.getContext('2d'); const {data,width:w,height:hh}=ctx.getImageData(0,0,c.width,c.height); let x0=w,y0=hh,x1=-1,y1=-1;
  for(let y=0;y<hh;y++) for(let x=0;x<w;x++) if(data[(y*w+x)*4+3]>8){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y }
  if(x1<0) return null; const p=6; x0=Math.max(0,x0-p);y0=Math.max(0,y0-p);x1=Math.min(w-1,x1+p);y1=Math.min(hh-1,y1+p);
  const o=document.createElement('canvas'); o.width=x1-x0+1; o.height=y1-y0+1; o.getContext('2d').drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height); return o;
}

let sampleP=null;
function getSample(){ if(!window.claude?.use) return Promise.resolve(null); return sampleP ||= window.claude.use('sample').catch(()=>null) }
function sampleErr(e){ const c=e?.code; return c==='not_granted'?'你沒有允許這個頁面使用 Claude，所以無法執行。重新整理頁面後可以再允許一次。':c==='rate_limited'?'請求太頻繁，請稍等一下再試。':c==='cancelled'?'已停止。':c==='too_large'||c==='input_too_large'?'文字太長，請縮小頁碼範圍。':`Claude 無法完成：${e?.message||c||e}` }
function mdToHtml(md){
  const lines=esc(md).split('\n'); let html='',inList=false; const inline=s=>s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<code>$1</code>');
  for(const l of lines){ const m=l.match(/^(#{1,4})\s+(.*)/); const li=l.match(/^\s*[-*•]\s+(.*)/)||l.match(/^\s*\d+[.)]\s+(.*)/);
    if(li){ if(!inList){html+='<ul>';inList=true} html+=`<li>${inline(li[1])}</li>`; continue } if(inList){html+='</ul>';inList=false}
    if(m) html+=`<h${Math.min(3,m[1].length+1)}>${inline(m[2])}</h${Math.min(3,m[1].length+1)}>`; else if(l.trim()) html+=`<p>${inline(l)}</p>` }
  return html+(inList?'</ul>':'');
}
async function pagesText(f,rangeStr,api){ const js=await f.js(); const idx=parseRanges(rangeStr,js.numPages,{allowEmpty:true}).flat(); const pages=await docText(f,{pages:idx,onProgress:x=>api.progress('擷取文字中…',x)}); return pages.map(p=>({n:p.n,text:p.paras.map(x=>(x.head?'## ':x.bullet?'':'')+x.text).join('\n')})) }
function aiUnavailable(api){ api.setView(h('div',{class:'panel'},h('h3',{style:'font-size:16px;margin-bottom:6px'},'這個功能需要 Claude'),h('p',{class:'hint'},'AI 摘要與翻譯會用你自己的 Claude 帳號處理擷取出的文字。請在 claude.ai 或 Claude App 裡開啟這個頁面再使用。其他工具都可以照常離線運作。'))) }

    const renderPick=()=>{ pick.replaceChildren(...flows.map((f,i)=>h('option',{value:i,selected:f.name===cur.name},f.name))) };
    const render=()=>{ box.replaceChildren(...(cur.steps.length?cur.steps.map((s,i)=>{ const T=STEP_TYPES[s.type]; return h('div',{class:'step'},h('div',{class:'step-h'},h('span',{class:'mono'},`${i+1}`),h('b',{},T.name),
        h('button',{type:'button',class:'ib','aria-label':'上移',disabled:i===0,onclick:()=>{[cur.steps[i-1],cur.steps[i]]=[cur.steps[i],cur.steps[i-1]];render()}},'↑'),
        h('button',{type:'button',class:'ib','aria-label':'下移',disabled:i===cur.steps.length-1,onclick:()=>{[cur.steps[i+1],cur.steps[i]]=[cur.steps[i],cur.steps[i+1]];render()}},'↓'),
        h('button',{type:'button',class:'ib','aria-label':'移除步驟',onclick:()=>{cur.steps.splice(i,1);render()}},'×')),T.ui(s,()=>{})) }):[h('p',{class:'hint'},'還沒有步驟，從下方加入。')])) };
    pick.addEventListener('change',()=>{ const f=flows[+pick.value]; cur={name:f.name,steps:f.steps.map(s=>({...s}))}; nameIn.value=cur.name; render() });
    api.opts.append(field('已儲存的流程',pick),field('流程名稱',nameIn),field('步驟',box),
      field('加入步驟',h('div',{class:'row'},addSel,h('button',{type:'button',class:'btn sm',onclick:()=>{ cur.steps.push({type:addSel.value,...structuredClone(STEP_TYPES[addSel.value].def)}); render() }},'加入'))),
      h('div',{class:'row'},h('button',{type:'button',class:'btn sm',onclick:()=>{ const nm=nameIn.value.trim()||'未命名流程'; cur.name=nm; const i=flows.findIndex(f=>f.name===nm); const copy={name:nm,steps:cur.steps.map(s=>({...s}))}; if(i>=0) flows[i]=copy; else flows.push(copy); persist(); renderPick(); toast('已儲存流程（密碼不會被儲存）') }},'儲存流程'),
        h('button',{type:'button',class:'btn sm ghost',onclick:()=>{ const i=flows.findIndex(f=>f.name===cur.name); if(i<0) return; flows.splice(i,1); if(!flows.length) flows=[{name:'新流程',steps:[]}]; persist(); const f=flows[0]; cur={name:f.name,steps:f.steps.map(s=>({...s}))}; nameIn.value=cur.name; renderPick(); render() }},'刪除這個流程')),
      h('p',{class:'hint'},'流程存在這個瀏覽器裡。為了安全，密碼不會被儲存，每次使用時再輸入。'));
    renderPick(); render();
    api.setView(h('div',{class:'empty'},'放入要批次處理的 PDF，右邊設定步驟。'));
    api.def.onFiles=()=>api.setView(h('p',{class:'hint'},`已加入 ${api.files.length} 個檔案，會依序套用右側每個步驟。`));
    api.setRun('執行流程',async()=>{
      if(!cur.steps.length) throw new UserError('流程裡還沒有任何步驟。'); const si=cur.steps.findIndex(s=>s.type==='split'); if(si>=0&&si!==cur.steps.length-1) throw new UserError('「每頁拆成單檔」必須是最後一步。');
      if(cur.steps.some(s=>s.type==='protect'&&(s.pw||'').length<4)) throw new UserError('加密步驟需要至少 4 個字元的密碼。');
      const outs=[]; const total=api.files.length*cur.steps.length; let done=0;
      for(const f0 of api.files){ let f=new PdfFile(f0.name,f0.bytes); let suffix='';
        for(const s of cur.steps){ api.progress(`${f0.name}：${STEP_TYPES[s.type].name}`,done/total); let b;
          if(s.type==='rotate') b=await coreRotate(f,s.deg);
          else if(s.type==='pages'){ const lib=await openLib(f); b=await coreExtract(f,parseRanges(s.range,lib.getPageCount()).flat()) }
          else if(s.type==='watermark') b=await coreWatermark(f,{kind:'text',text:s.text,size:46,color:'#8a8f98',opacity:s.opacity,angle:30,pos:4},'');
          else if(s.type==='compress') b=await coreCompress(f,s.level);
          else if(s.type==='unlock') b=(await coreUnlock(f,s.pw)).bytes;
          else if(s.type==='protect') b=await coreProtect(f,{user:s.pw,owner:s.pw+'#'+Math.random().toString(36).slice(2,10),perms:{printing:'highResolution',copying:true,modifying:false,annotating:true,fillingForms:true,contentAccessibility:true,documentAssembly:false}});
          else if(s.type==='split'){ const lib=await openLib(f); const n=lib.getPageCount(); const pad=String(n).length; for(let i=0;i<n;i++) outs.push({name:`${f0.base}_第${String(i+1).padStart(pad,'0')}頁.pdf`,blob:pdfBlob(await coreExtract(f,[i]))}); b=null }
          done++; if(b) f=new PdfFile(f0.name,b); else { f=null; break }
        }
        if(f) outs.push({name:`${f0.base}_${(cur.name||'處理後').replace(/[\\/:*?"<>|]/g,'')}.pdf`,blob:pdfBlob(f.bytes)});
      }
      return {outs,zipName:`${cur.name||'流程輸出'}.zip`};
    });
  }});

/* ---------- start ---------- */
if(IN_CLAUDE) $('#foot').textContent='處理全部在這個頁面內完成。AI 摘要與翻譯會把擷取出的文字送給 Claude（使用你的 Claude 帳號），其餘工具不會傳出任何內容。';
if(!window.PDFLib||!window.pdfjsLib){ app.replaceChildren(h('div',{class:'err'},'PDF 元件沒有載入成功，請確認網路連線後重新整理頁面。')) }
else route();
</script>
